<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>discover — musical</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav" id="navbar"></nav>

  <main class="container">
    <div class="page-header">
      <h1>discover</h1>
      <p class="muted">find your taste twins. filter by genre or just scroll.</p>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">all</button>
      <button class="filter" data-filter="shoegaze">shoegaze</button>
      <button class="filter" data-filter="dream pop">dream pop</button>
      <button class="filter" data-filter="techno">techno</button>
      <button class="filter" data-filter="indie rock">indie rock</button>
      <button class="filter" data-filter="hip hop">hip hop</button>
      <button class="filter" data-filter="metal">metal</button>
      <button class="filter" data-filter="synthwave">synthwave</button>
    </div>

    <div class="user-list" id="discover-list"></div>
  </main>

  <footer class="footer">
    <p>musical — 2026</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    APP.requireAuth();
    APP.renderNav();
    APP.initDiscover();
  </script>
</body>
</html>

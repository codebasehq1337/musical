<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>profile — musical</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav" id="navbar"></nav>

  <main class="container">
    <div class="profile-top">
      <div class="profile-avatar-large" id="p-avatar">?</div>
      <div class="profile-meta">
        <div class="connections" id="p-connections"></div>
        <h1 id="p-name">...</h1>
        <p id="p-handle" class="muted">...</p>
        <p id="p-bio">...</p>
        <div class="profile-actions" id="p-actions"></div>
      </div>
    </div>

    <div class="profile-grid">
      <div class="profile-main">
        <section class="section">
          <h2>## recently played</h2>
          <div class="track-list" id="p-tracks"></div>
        </section>

        <section class="section">
          <h2>## stats</h2>
          <div class="stats-grid" id="p-stats"></div>
          <div class="genre-tags" id="p-genres" style="margin-top: 20px;"></div>
        </section>
      </div>

      <aside class="profile-side">
        <section class="section">
          <h2>## playlists</h2>
          <div class="playlist-list" id="p-playlists"></div>
        </section>

        <section class="section" id="friends-section">
          <h2>## friends</h2>
          <div class="friend-list" id="p-friends"></div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>musical — 2026</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    APP.requireAuth();
    APP.renderNav();
    APP.renderProfilePage();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login — musical</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">musical</a>
    <div class="nav-links">
      <a href="index.html">home</a>
    </div>
  </nav>

  <main class="container" style="max-width: 420px; padding-top: 80px;">
    <div class="auth-box">
      <h1 id="auth-title">log in</h1>
      <p class="muted" id="auth-sub">no email. just a name and password.</p>

      <form id="auth-form" onsubmit="return false;">
        <div class="form-group">
          <label>username</label>
          <input type="text" id="auth-user" placeholder="yourname" autocomplete="off">
        </div>
        <div class="form-group">
          <label>password</label>
          <input type="password" id="auth-pass" placeholder="••••••••">
        </div>
        <div class="form-group" id="confirm-group" style="display: none;">
          <label>confirm password</label>
          <input type="password" id="auth-confirm" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;" id="auth-btn">log in</button>
      </form>

      <p class="auth-toggle">
        <span id="auth-toggle-text">no account?</span>
        <button class="btn btn-ghost btn-sm" id="auth-toggle" onclick="APP.toggleAuth()">sign up</button>
      </p>

      <p class="muted" style="font-size: 12px; margin-top: 24px; text-align: center;">
        everything is stored locally in your browser. no server. no tracking.
      </p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    APP.initAuthPage();
  </script>
</body>
</html>
